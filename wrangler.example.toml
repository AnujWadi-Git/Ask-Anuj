# REFERENCE ONLY: renamed so Cloudflare Pages ignores it and uses the bindings set in the dashboard (docs/DEPLOY.md).
name = "ask-anuj"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# Workers AI: free plan = 10,000 Neurons/day, hard stop (no overage on Free).
[ai]
binding = "AI"

# Replace database_id after `wrangler d1 create ask-anuj` (see docs/DEPLOY.md).
[[d1_databases]]
binding = "DB"
database_name = "ask-anuj"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
AI_PROVIDER = "cloudflare"   # "mock" for local UI testing without Cloudflare login
